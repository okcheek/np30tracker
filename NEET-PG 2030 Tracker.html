function load(){try{var j=JSON.parse(localStorage.getItem('np30b'));if(j&&j.d)return j}catch(e){}return{d:{}}}
function save(){try{localStorage.setItem('np30b',JSON.stringify(S))}catch(e){}}
function dt(i){return new Date(2026,10,1+i)}
function fd(d,w){return(w?WD[d.getDay()]+', ':'')+p2(d.getDate())+' '+MO[d.getMonth()]+' '+d.getFullYear()}
function tI(){var t=new Date();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-D0)/864e5)}
function mk(i){return S.d[i]||0}function st(i){return mk(i)==15?2:mk(i)?1:0}
function rng(r){return'L'+r.a+(r.n>1?'-L'+(r.a+r.n-1):'')}
function hm(m){return Math.floor(m/60)+'h '+p2(m%60)+'m'}
function tk(i,k){S.d[i]=mk(i)^(1<<k);save();render()}
function sc(c){return c==2?' c':c==1?' p':''}
function lecDone(i){return mk(i)&1?DAYS[i].r.reduce(function(a,r){return a+r.n},0):0}
function sDone(s){return SD[s].reduce(function(a,x){return a+(mk(x[0])&1?x[1].n:0)},0)}
function doneAll(){return DAYS.reduce(function(a,d){return a+lecDone(d.i)},0)}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function tasks(d){var L=['Marrow','Notes','QBank','Recall'];
 if(d.t=='L')return[['Marrow','Watch assigned lectures'],['Notes','Annotate Marrow notes'],['QBank','20–30 Qs + explanations'],['Recall','Previous-day + same-day recall']];
 var x=d.t=='R'?['Weekly revision','Consolidate notes','75–100 Qs','Test + error log']:d.t=='C'?['Catch-up / marked notes','Consolidate','50–100 Qs','Recall + error log']:['3rd Prof main block','Prof notes / answer writing','20–30 NEET Qs','30-min recall'];
 return x.map(function(a){return[a,'']})}
function checks(i){var d=DAYS[i];return'<div class="ck">'+tasks(d).map(function(t,k){var on=mk(i)>>k&1;return'<div class="c'+(on?' on':'')+'" onclick="tk('+i+','+k+')"><span class="bx">'+(on?'✓':'')+'</span>'+t[0]+'</div>'}).join('')+'</div>'}
function blocks(i,det){var d=DAYS[i],s=st(i),h='';
 if(d.t=='L')d.r.forEach(function(r){h+='<div class="blk" style="border-color:'+COL[r.s]+'"><div><b>'+SN[r.s]+'</b><span class="mut">'+rng(r)+' • '+r.n+' lec'+(det?' • '+hm(r.sum):'')+'</span></div><span class="stt'+sc(s)+'">'+STN[s]+'</span></div>'});
 else h='<div class="blk" style="border-color:var(--track)"><div><b>'+(d.t=='R'?'Weekly revision':d.t=='C'?'Catch-up':'3rd Prof block')+'</b><span class="mut">'+(d.t=='R'?'No new lecture':d.t=='C'?'First pass complete':d.f)+'</span></div><span class="stt'+sc(s)+'">'+STN[s]+'</span></div>';
 return h}
function ic(n){var p={dash:'<rect x="4" y="4" width="9" height="9" rx="2"/><rect x="17" y="4" width="9" height="9" rx="2"/><rect x="4" y="17" width="9" height="9" rx="2"/><rect x="17" y="17" width="9" height="9" rx="2"/>',today:'<circle cx="15" cy="15" r="5"/><path d="M15 3v3M15 24v3M3 15h3M24 15h3M6.5 6.5l2 2M21.5 21.5l2 2M6.5 23.5l2-2M21.5 8.5l2-2"/>',sched:'<rect x="4" y="6" width="22" height="20" rx="3"/><path d="M4 12h22M10 3v5M20 3v5M10 17h2M15 17h2M20 17h2M10 21h2M15 21h2"/>',subs:'<rect x="4" y="8" width="5" height="18" rx="1"/><rect x="11" y="5" width="6" height="21" rx="1"/><path d="M19 8l5-2 4 17-5 2z"/>',prog:'<path d="M7 26V14M15 26V5M23 26V18"/><path d="M4 26h22"/>'};return'<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p[n]+'</svg>'}
function go(t){tab=t;sd=null;render();scrollTo(0,0)}
function dash(){var t=tI(),d=t>=0&&t<N?DAYS[t]:null,D=doneAll(),h='<h1>NEET-PG 2030</h1><p class="sub">'+fd(new Date(),1).replace(/^(\w+),/,'$1,')+'</p>',sub='—',lec='—',stt='No tasks';
 if(d&&d.t=='L'){sub=d.r.map(function(r){return SN[r.s]}).join(', ');lec=d.r.map(rng).join(', ');stt=STN[st(t)]}else if(d){stt=STN[st(t)];sub=d.f||'—'}
 function T(k,v,x){return'<div class="tile"'+(x||'')+'><div class="cap">'+k+'</div><b>'+v+'</b></div>'}
 h+='<div class="tiles">'+T('Overall',Math.round(pct(D,ALL))+'%')+T('Completed',D+' / '+ALL)+T('Today',p2(new Date().getDate())+' '+MO[new Date().getMonth()])+T('Today\'s subject',sub,' style="border-left:5px solid '+(d&&d.t=='L'?COL[d.r[0].s]:'var(--track)')+'"')+T('Today\'s lectures',lec)+T('Today\'s status',stt)+'</div>';
 var A=stats();h+='<div class="two"><div class="card"><h2>Overall Progress</h2><div class="big">'+pct(D,ALL).toFixed(1)+'%</div><div class="bar"><i style="width:'+pct(D,ALL)+'%"></i></div><div class="three"><div><b>'+A.dd+'</b><span>Completed days</span></div><div><b>'+A.sk+'</b><span>Streak</span></div><div><b>'+(ALL-D)+'</b><span>Pending</span></div></div></div>';
 h+='<div class="card"><h2>Subject Progress</h2>'+SN.map(function(n,s){var k=sDone(s);return'<div class="sp"><div class="r"><span class="dot" style="background:'+COL[s]+'"></span><b class="g">'+n+'</b><span class="mut">'+k+'/'+TOT[s]+'</span><span class="pc">'+Math.round(pct(k,TOT[s]))+'%</span></div><div class="bar"><i style="width:'+pct(k,TOT[s])+'%"></i></div></div>'}).join('')+'</div></div>';return h}
function stats(){var t=tI(),dd=0,sk=0,wk=0,mo=0,n=new Date();DAYS.forEach(function(d){if(st(d.i)==2)dd++;var x=dt(d.i);if(mk(d.i)&1){var l=lecDone(d.i);if(x.getMonth()==n.getMonth()&&x.getFullYear()==n.getFullYear())mo+=l;var o=t-((n.getDay()+6)%7);if(d.i>=o&&d.i<o+7)wk+=l}});
 for(var i=Math.min(t,N-1);i>=0;i--){if(st(i)==2)sk++;else if(i==t)continue;else break}return{dd:dd,sk:sk,wk:wk,mo:mo}}
function today(){var t=tI(),h='<div class="cap">Today</div><h1 style="font-size:26px">'+fd(new Date(),1)+'</h1>';
 if(t<FL||t>=N)return h+'<div class="empty">'+ic('subs').replace('<svg','<svg width="64" height="64"')+'<b>No lectures scheduled for today.</b><span class="mut">'+(t<FL?'Schedule starts '+fd(dt(FL))+'.':'First pass schedule has ended.')+'</span></div>';
 return h+dayCard(t)}
function dayCard(i){var d=DAYS[i],h='<div class="card" style="margin-top:14px">'+blocks(i,1);
 if(d.t=='L'){d.r.forEach(function(r){h+='<div class="mut" style="margin:4px 0 8px">'+SN[r.s]+': '+r.m.map(function(m,k){return'L'+(r.a+k)+' ('+m+'m)'}).join(' · ')+'</div>'});h+='<div class="mut" style="margin-bottom:6px"><b>Total: '+hm(d.r.reduce(function(a,r){return a+r.sum},0))+'</b></div>'}
 h+=tasks(d).map(function(t,k){var on=mk(i)>>k&1;return'<div class="tk" onclick="tk('+i+','+k+')"><span class="c'+(on?' on':'')+'"><span class="bx">'+(on?'✓':'')+'</span></span><div><b>'+t[0]+'</b><span class="mut">'+(t[1]?t[1]+' • ':'')+TIM[k]+'</span></div></div>'}).join('');return h+'</div>'}
function pick(i){sel=i;vm=null;render()}
function mv(n){var d=dt(sel);if(sv=='month'){vm=vm||[d.getFullYear(),d.getMonth()];vm[1]+=n;if(vm[1]<0){vm[1]=11;vm[0]--}if(vm[1]>11){vm[1]=0;vm[0]++}}else{sel=Math.max(0,Math.min(N-1,sel+n*(sv=='week'?7:1)))}render()}
function sched(){if(sel===null)sel=Math.max(FL,Math.min(N-1,tI()));var d=dt(sel),h='<h1>Schedule</h1><div class="seg">'+['day','week','month'].map(function(v){return'<button class="'+(sv==v?'on':'')+'" onclick="sv=\''+v+'\';vm=null;render()">'+v.toUpperCase()+'</button>'}).join('')+'</div>';
 if(sv=='month'){vm=vm||[d.getFullYear(),d.getMonth()];var f=new Date(vm[0],vm[1],1),off=(f.getDay()+6)%7,dim=new Date(vm[0],vm[1]+1,0).getDate(),t=tI();
  h+='<div class="card"><div class="mh"><button class="nb" onclick="mv(-1)">‹</button>'+MF[vm[1]]+' '+vm[0]+'<button class="nb" onclick="mv(1)">›</button></div><div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return'<div class="h">'+x+'</div>'}).join('');
  for(var k=0;k<off;k++)h+='<div></div>';
  for(var n=1;n<=dim;n++){var i=Math.round((new Date(vm[0],vm[1],n)-D0)/864e5),ok=i>=0&&i<N;h+=ok?'<div class="cd'+(i==sel?' s':'')+(i==t?' t':'')+'" onclick="pick('+i+')">'+n+'<i class="'+(st(i)==2?'c':st(i)?'p':'')+'"></i></div>':'<div class="cd" style="color:var(--mut);cursor:default">'+n+'</div>'}
  h+='</div></div><div class="card"><h2>'+fd(d,1)+'</h2>'+blocks(sel)+checks(sel)+'</div>'}
 else if(sv=='week'){var o=sel-((d.getDay()+6)%7);h+='<div class="card"><div class="mh"><button class="nb" onclick="mv(-1)">‹</button>'+fd(dt(Math.max(0,o)))+' – '+fd(dt(Math.min(N-1,o+6)))+'<button class="nb" onclick="mv(1)">›</button></div>';
  for(var i=Math.max(0,o);i<Math.min(N,o+7);i++)h+='<div onclick="sv=\'day\';sel='+i+';render()" style="cursor:pointer"><div class="cap" style="margin:12px 0 6px">'+fd(dt(i),1)+'</div>'+blocks(i)+'</div>';h+='</div>'}
 else h+='<div class="card"><div class="mh"><button class="nb" onclick="mv(-1)">‹</button>'+fd(d,1)+'<button class="nb" onclick="mv(1)">›</button></div></div>'+dayCard(sel).replace(' style="margin-top:14px"','');
 return h}
function subs(){if(sd!==null)return detail();var h='<h1>Subjects</h1><p class="sub">'+SN.length+' subjects • '+ALL+' lectures</p>';
 return h+SN.map(function(n,s){var k=sDone(s);return'<div class="sc" style="border-color:'+COL[s]+'" onclick="sd='+s+';ft=\'all\';render();scrollTo(0,0)"><div class="g"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">'+n+'</b><span class="pc" style="font-weight:600">'+Math.round(pct(k,TOT[s]))+'%</span></div><span class="mut">'+k+' of '+TOT[s]+' lectures</span><div class="bar"><i style="width:'+pct(k,TOT[s])+'%"></i></div></div><span class="chev">›</span></div>'}).join('')}
function detail(){var s=sd,k=sDone(s),h='<div class="hd" style="background:'+COL[s]+'"><button onclick="sd=null;render()">‹</button><div><h1 style="font-size:26px">'+SN[s]+'</h1><span>'+k+' / '+TOT[s]+' · '+pct(k,TOT[s]).toFixed(1)+'%</span></div></div><div class="card" style="padding:14px"><div class="bar"><i style="width:'+pct(k,TOT[s])+'%"></i></div></div><div class="chips">'+['all','completed','pending'].map(function(f){return'<button class="'+(ft==f?'on':'')+'" onclick="ft=\''+f+'\';render()">'+f[0].toUpperCase()+f.slice(1)+'</button>'}).join('')+'</div>';
 SD[s].forEach(function(x){var i=x[0],r=x[1],c=st(i);if(ft=='completed'&&c!=2)return;if(ft=='pending'&&c==2)return;h+='<div class="row" style="border-color:'+COL[s]+'"><div class="t"><span>'+fd(dt(i))+'</span><b>'+rng(r)+'</b><span class="stt'+sc(c)+'">'+STN[c]+'</span></div>'+checks(i)+'</div>'});return h}
function prog(){var D=doneAll(),A=stats(),r=70,C=2*Math.PI*r,h='<h1>Progress</h1><div class="card" style="margin-top:14px"><h2>Completed vs Remaining</h2><div class="dn"><svg viewBox="0 0 200 200" width="250" height="250"><circle cx="100" cy="100" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="26"/><circle cx="100" cy="100" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="26" stroke-dasharray="'+C*D/ALL+' '+C+'" transform="rotate(-90 100 100)"/><text x="100" y="100" text-anchor="middle" font-size="25" font-weight="800" fill="var(--ink)">'+pct(D,ALL).toFixed(1)+'%</text><text x="100" y="120" text-anchor="middle" font-size="12" fill="var(--mut)">'+D+' / '+ALL+'</text></svg></div><div style="text-align:center;font-weight:600"><span style="color:var(--acc)">●</span> Completed · '+D+' &nbsp; <span style="color:var(--track)">●</span> Remaining · '+(ALL-D)+'</div></div>';
 h+='<div class="card"><h2>Subject Progress</h2><div class="chart">'+[0,20,40,60,80,100].map(function(v){return'<div class="gl" style="bottom:'+v+'%"><span>'+v.toFixed(1)+'</span></div>'}).join('')+'<div class="bars">'+SN.map(function(n,s){var p=pct(sDone(s),TOT[s]);return'<div class="bc"><small>'+Math.round(p)+'%</small><div style="height:'+Math.max(p,2)+'%;background:'+COL[s]+'"></div><em>'+n.slice(0,5)+'…</em></div>'}).join('')+'</div></div></div>';
 function T(k,v){return'<div class="tile" style="background:var(--fill)"><b style="font-size:26px;margin:0">'+v+'</b><span class="mut">'+k+'</span></div>'}
 return h+'<div class="card"><h2>At a glance</h2><div class="tiles" style="margin:0">'+T('Streak',A.sk)+T('Days done',A.dd)+T('This week',A.wk)+T('This month',A.mo)+'</div></div><button class="chips" style="border:0;background:none;color:var(--mut);font:14px inherit;cursor:pointer" onclick="if(confirm(\'Reset all progress?\')){S={d:{}};save();render()}">Reset all progress</button>'}
var TABS=[['dash','Dashboard'],['today','Today'],['sched','Schedule'],['subs','Subjects'],['prog','Progress']];
function render(){document.getElementById('nav').innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+ic(t[0])+t[1]+'</button>'}).join('');document.getElementById('v').innerHTML=({dash:dash,today:today,sched:sched,subs:subs,prog:prog})[tab]()}
render();
</script></body></html>
